[project]
name = "mcp-from-first-principles"
version = "0.1.0"
description = "A tutorial-first global-trade intelligence project that introduces MCP one useful abstraction at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "mcp[cli]>=2,<3",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call live public APIs and may be skipped offline",
]
